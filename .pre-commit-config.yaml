default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: license-headers
        name: AGPL source headers
        entry: >-
          bash -c 'status=0; while IFS= read -r -d "" file; do case "$file" in *.py) header="# SPDX-License-Identifier: AGPL-3.0-or-later" ;; *.rs) header="// SPDX-License-Identifier: AGPL-3.0-or-later" ;; esac; if [ "$(head -n 1 "$file")" != "$header" ]; then echo "Missing or invalid AGPL header: $file"; status=1; fi; done < <(find core server -type f \( -name "*.py" -o -name "*.rs" \) ! -path "*/target/*" ! -path "*/.venv/*" -print0); exit "$status"'
        language: system
        pass_filenames: false
        always_run: true
      - id: core-coverage
        name: Core Rust tests and coverage
        entry: bash -c 'cd core && cargo coverage'
        language: system
        pass_filenames: false
        always_run: true
      - id: server-validation
        name: Server Python tests and type checks
        entry: bash -c 'cd server && uv run pytest && uv run mypy .'
        language: system
        pass_filenames: false
        always_run: true
      - id: client-validation
        name: Client Flutter analysis, tests, and coverage
        entry: >-
          bash -c 'set -e; for module in client/*; do [ -f "$module/pubspec.yaml" ] ||
          continue; (cd "$module" && flutter analyze && flutter test --coverage && awk -F:
          "/^DA:/ { split(\$2, fields, \",\"); total++; if (fields[2] > 0) covered++ } END { if
          (total == 0 || covered != total) { printf \"Coverage: %d/%d\\n\", covered, total; exit 1
          } }" coverage/lcov.info); done'
        language: system
        pass_filenames: false
        always_run: true
