[package]
name = "gradus-openweight"
description = "OpenWeight JSON Schema validation for Gradus."
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
jsonschema = { version = "=0.42.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
sha2 = "0.10"
